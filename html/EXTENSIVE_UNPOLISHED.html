const PartV_LOSSES = () => (<div>
  <p className="dropcap">This is the scientific core of the project. We train the exact same SkinCNN on the exact same data with the same seed and the same optimiser — and change only the loss function (or, in the fifth experiment, the data sampler). The differences in the resulting metrics are therefore attributable to the loss alone.</p>
  <h3 className="display text-2xl font-semibold mt-6 mb-3">23.1 · The five formulations</h3>
  <div className="space-y-4">
    <div className="frame rounded p-5">
      <div className="ui sc text-xs text-stone-500 font-bold">EXPERIMENT 1 · BASELINE</div>
      <h4 className="display text-xl font-semibold mt-1 mb-2">Standard Cross-Entropy</h4>
      <MathBlock>{`\\mathcal{L}_{\\mathrm{CE}}=-\\log p_y`}</MathBlock>
      <p className="text-[15px]">{`Every sample contributes equally to the mean. Because $67\\%$ of samples are nv, minimising the mean means getting nv right. The network is rewarded for ignoring everything else.`}</p>
    </div>
    <div className="frame rounded p-5">
      <div className="ui sc text-xs text-stone-500 font-bold">EXPERIMENT 2</div>
      <h4 className="display text-xl font-semibold mt-1 mb-2">Weighted Cross-Entropy</h4>
      <MathBlock>{`\\mathcal{L}_{\\mathrm{wCE}}=-w_y\\,\\log p_y,\\qquad w_c=\\frac{1/N_c}{\\sum_{c'}1/N_{c'}}\\cdot K`}</MathBlock>
      <p className="text-[15px]">{`Per-class scalar weights inversely proportional to class size, normalised so they average to $1$. A misclassified df example produces a gradient roughly $59\\times$ larger than a misclassified nv example.`}</p>
    </div>
    <div className="frame rounded p-5 border-l-[5px] border-emerald-700 bg-emerald-50/50">
      <div className="flex items-center justify-between">
        <div className="ui sc text-xs text-emerald-800 font-bold">EXPERIMENT 3 · WINNER</div>
        <span className="chip" style={{borderColor:"#0e6b4e",color:"#0e6b4e"}}>Lin et al., 2017</span>
      </div>
      <h4 className="display text-xl font-semibold mt-1 mb-2">Focal Loss (γ=2)</h4>
      <MathBlock>{`\\mathcal{L}_{\\mathrm{focal}}=-\\alpha_y(1-p_y)^{\\gamma}\\log p_y`}</MathBlock>
      <p className="text-[15px]">{`The modulating factor $(1-p_y)^{\\gamma}$ collapses the loss on easy examples. If the model is $99\\%$ confident the true class is nv, $(1-0.99)^2=10^{-4}$ — the network barely receives any gradient from already-easy examples and is forced to focus on hard / rare ones.`}</p>
    </div>
    <div className="frame rounded p-5">
      <div className="ui sc text-xs text-stone-500 font-bold">EXPERIMENT 4</div>
      <h4 className="display text-xl font-semibold mt-1 mb-2">Class-Balanced Cross-Entropy</h4>
      <MathBlock>{`E_c=\\frac{1-\\beta^{N_c}}{1-\\beta},\\quad w_c\\propto\\frac{1}{E_c},\\quad \\beta=0.999`}</MathBlock>
      <p className="text-[15px]">{`Cui et al. (CVPR 2019) noticed that as class size grows, the marginal information added by each new image overlaps with existing ones. The "effective number of samples" smooths the inverse-frequency weighting so the majority weight does not collapse to zero.`}</p>
    </div>
    <div className="frame rounded p-5">
      <div className="ui sc text-xs text-stone-500 font-bold">EXPERIMENT 5 · DATA-SIDE FIX</div>
      <h4 className="display text-xl font-semibold mt-1 mb-2">Standard CE + WeightedRandomSampler</h4>
      <MathBlock>{`\\Pr(\\text{draw sample }i)\\propto 1/N_{y_i}`}</MathBlock>
      <p className="text-[15px]">{`The loss is plain CE — we instead change which examples appear in each batch. Each mini-batch contains, on average, equal numbers of every class. Same number of gradient steps, but rare examples are replayed many times.`}</p>
    </div>
  </div>
  <Figure caption="Focal modulation curve (1 − pᵧ)^γ at three values of γ. The horizontal axis is the predicted true-class probability; the vertical axis is the multiplier in front of −log pᵧ.">
    <svg viewBox="0 0 580 220" className="w-full">
      <line x1="40" y1="180" x2="540" y2="180" stroke="#cabfa3"/>
      <line x1="40" y1="20" x2="40" y2="180" stroke="#cabfa3"/>
      {[{g:0,c:"#9a3412",lab:"γ = 0 (plain CE)"},{g:1,c:"#a67c1f",lab:"γ = 1"},{g:2,c:"#0e6b4e",lab:"γ = 2 (we use this)"}].map((s,si)=>(

const PartV_METRICS = () => (<div>
  <p className="dropcap">As established in §19, overall accuracy is misleading on an imbalanced dataset. We need metrics that <i>expose</i> minority-class performance rather than hide it inside a frequency-weighted average. All of the metrics below are computed from one object: the confusion matrix.</p>
  <h3 className="display text-2xl font-semibold mt-6 mb-3">25.1 · The confusion matrix</h3>
  <Figure caption="A 7×7 confusion matrix for our problem. Rows = true class, columns = predicted class. The diagonal cells count correct predictions; off-diagonal cells count errors. A perfect classifier is purely diagonal.">
    <svg viewBox="0 0 420 360" className="w-full">
      {CLASSES.map((c,i)=>CLASSES.map((d,j)=>{
        const onDiag=i===j;return(<g key={i+"-"+j}>
          <rect x={70+j*40} y={50+i*40} width="38" height="38" fill={onDiag?"#e3efe8":"#fff"} stroke="#cabfa3"/>
          {onDiag && <text x={89+j*40} y={73+i*40} textAnchor="middle" className="mono" fontSize="11" fill="#0e6b4e" fontWeight="700">TP</text>}
        </g>);}))}
      {CLASSES.map((c,i)=>(<text key={"r"+i} x="60" y={75+i*40} textAnchor="end" className="mono" fontSize="11" fill={c.color}>{c.key}</text>))}
      {CLASSES.map((c,j)=>(<text key={"c"+j} x={89+j*40} y="44" textAnchor="middle" className="mono" fontSize="11" fill={c.color}>{c.key}</text>))}
      <text x="220" y="25" textAnchor="middle" className="ui" fontSize="12" fontWeight="700" fill="#1c1917">predicted →</text>
      <text x="35" y="180" textAnchor="middle" className="ui" fontSize="12" fontWeight="700" fill="#1c1917" transform="rotate(-90 35 180)">↑ true</text>
      <text x="220" y="345" textAnchor="middle" className="ui" fontSize="11" fill="#5a544a">diagonal cells = correct · off-diagonal = errors</text>
    </svg></Figure>
  <Definition title="Per-class TP, FP, FN, TN">{`For a fixed class $c$: $TP_c$ = predicted $c$ and is $c$. $FP_c$ = predicted $c$ but is not. $FN_c$ = predicted not $c$ but is $c$. $TN_c$ = predicted not $c$ and is not.`}</Definition>
  <h3 className="display text-2xl font-semibold mt-6 mb-3">25.2 · The metrics we report</h3>
  <div className="grid md:grid-cols-2 gap-4">
    <Definition title="Accuracy">{`$\\text{Acc}=\\dfrac{\\sum_c TP_c}{N}$. Fraction of correct predictions. <b>Misleading on imbalanced data</b>: a model that always predicts nv scores 67% accuracy.`}</Definition>
    <Definition title="Precision (per class)">{`$P_c=\\dfrac{TP_c}{TP_c+FP_c}$. Of the times the network said "class $c$", how often was it right?`}</Definition>
    <Definition title="Recall (per class)">{`$R_c=\\dfrac{TP_c}{TP_c+FN_c}$. Of the actual class-$c$ samples, how many did we catch? Clinically critical — missed melanomas live here.`}</Definition>
    <Definition title="F1 (per class)">{`$F1_c=\\dfrac{2\\,P_c R_c}{P_c+R_c}$. Harmonic mean of $P_c$ and $R_c$. Punishes a model that wins one and loses the other.`}</Definition>
    <Definition title="Macro F1">{`$F1_{\\text{macro}}=\\frac{1}{K}\\sum_c F1_c$. Unweighted mean of per-class F1. Every class gets a $1/7$ vote, no matter how rare.`}</Definition>
    <Definition title="Balanced accuracy">{`$\\text{BalAcc}=\\frac{1}{K}\\sum_c R_c$. The "class-symmetric" cousin of accuracy. Equals chance (≈ 14% for 7 classes) for a random classifier.`}</Definition>
  </div>
  <Theorem title="Why macro F1 — not accuracy — is the right yardstick here">{`Accuracy is a frequency-weighted mean of per-class recall: $\\text{Acc}=\\sum_c (N_c/N)\\,R_c$. On HAM10000 that weights nv at 67% and df at 1.1%. Macro F1 uses uniform weights — every class is equally important. That alignment with our actual clinical goal (do not miss the rare disease) is the entire reason we report macro F1.`}</Theorem>
</div>);

/* --- APP --- */
function App() {
  const [activeChapter, setActiveChapter] = useState("how-to");

  const jump = (id) => {
    setActiveChapter(id);
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  useEffect(() => {
    const ids = TOC.flatMap(p => p.chapters.map(c => c.id));
    
    const observer = new IntersectionObserver((entries) => {
      // Find all chapters currently intersecting the viewport
      const intersecting = entries.filter(e => e.isIntersecting);
      if (intersecting.length > 0) {
        // Sort to find the topmost element to accurately track reading progress
        intersecting.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        const activeId = intersecting[0].target.id;
        if (ids.includes(activeId)) setActiveChapter(activeId);
      }
    }, { rootMargin: "-15% 0px -75% 0px" });

    // Slight delay ensures the DOM is fully painted by React before observing
    setTimeout(() => {
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) observer.observe(el);
      });
    }, 150);

    return () => observer.disconnect();
  }, []);

  return (
    <div>
      <GlobalDefs />
      <Hero />
      <StickyNav active={activeChapter} onJump={jump} />
      <BookContent />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
